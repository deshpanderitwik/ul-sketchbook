<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ul-sketchbook</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; background: #0a0a0a; color: #e8e8e8; }
    body {
      font: 15px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      padding: max(24px, env(safe-area-inset-top)) 16px 48px;
      max-width: 640px; margin: 0 auto;
    }
    h1 { font-size: 15px; font-weight: 600; margin: 0 0 24px; letter-spacing: 0.02em; }
    h1 span { color: #777; font-weight: 400; }
    ol { list-style: none; padding: 0; margin: 0; }
    li a {
      display: flex; gap: 14px; align-items: baseline;
      padding: 14px 0; border-top: 1px solid #222;
      color: inherit; text-decoration: none;
    }
    li:last-child a { border-bottom: 1px solid #222; }
    li a:active { background: #161616; }
    .n { color: #666; width: 3ch; flex: none; }
    .name { flex: 1; }
    .desc { color: #888; font-size: 13px; }
    @media (hover: hover) { li a:hover .name { text-decoration: underline; } }
  </style>
</head>
<body>
  <h1>ul-sketchbook <span>/ creative code experiments</span></h1>
  <ol id="list"></ol>
  <script>
    // Add new sketches here, newest last. Folder is relative to ./sketches/.
    const SKETCHES = [
      { n: '001', folder: '001-first-light', name: 'first light', desc: 'particles orbiting a wandering attractor' },
      { n: '002', folder: '002-ripples', name: 'ripples', desc: 'tap to drop interfering waves on a dot grid' },
    ];
    const list = document.getElementById('list');
    for (const s of [...SKETCHES].reverse()) {
      const li = document.createElement('li');
      li.innerHTML = `<a href="./sketches/${s.folder}/">
        <span class="n">${s.n}</span>
        <span class="name">${s.name}</span>
        <span class="desc">${s.desc ?? ''}</span>
      </a>`;
      list.appendChild(li);
    }
  </script>
</body>
</html>
